syntax = "proto3";

package conversation.v1;

import "google/protobuf/timestamp.proto";
import "avatarshape/v1/avatarshape.proto";
import "status/v1/status.proto";

option go_package = "github.com/maltira/chavo-project-backend/proto/gen/go/conversation/v1;conversationv1";

// Методы работают от имени пользователя из metadata x-user-id (ставит Gateway).
service ConversationService {
  rpc ListConversations(ListConversationsRequest) returns (ListConversationsResponse);
  rpc GetConversation(GetConversationRequest) returns (GetConversationResponse);
  rpc SearchPublicGroups(SearchPublicGroupsRequest) returns (SearchPublicGroupsResponse);

  rpc CreateGroup(CreateGroupRequest) returns (CreateGroupResponse);
  rpc UpdateGroup(UpdateGroupRequest) returns (UpdateGroupResponse);
  // SetGroupStatus — только админ группы; ставит новый статус целиком, прежний заменяется.
  rpc SetGroupStatus(SetGroupStatusRequest) returns (SetGroupStatusResponse);
  rpc ClearGroupStatus(ClearGroupStatusRequest) returns (ClearGroupStatusResponse);
  // SetGroupAvatarShape - только админ группы; ставит фигуру целиком, прежняя заменяется
  rpc SetGroupAvatarShape(SetGroupAvatarShapeRequest) returns (SetGroupAvatarShapeResponse);
  rpc ClearGroupAvatarShape(ClearGroupAvatarShapeRequest) returns (ClearGroupAvatarShapeResponse);
  // DeleteConversation: участник выходит, admin удаляет группу; личный чат - у себя или for_everyone у обоих.
  rpc DeleteConversation(DeleteConversationRequest) returns (DeleteConversationResponse);
  // ClearHistory - очищает историю чата только для вызывающего, сам чат остаётся в списке
  rpc ClearHistory(ClearHistoryRequest) returns (ClearHistoryResponse);
  rpc JoinGroup(JoinGroupRequest) returns (JoinGroupResponse);

  // История аватарок группы: до 5 последних фото, первое (самое новое) - текущее. Список виден участникам
  // и всем, если группа открытая; менять - только админы. Изменение уходит участникам как conversation.updated
  // (fields: ["avatar_url"]).
  rpc ListGroupAvatars(ListGroupAvatarsRequest) returns (ListGroupAvatarsResponse);
  // AddGroupAvatar - новое фото становится текущим; evicted_urls - выпавшие из истории (файлы удаляет Gateway).
  rpc AddGroupAvatar(AddGroupAvatarRequest) returns (AddGroupAvatarResponse);
  rpc SelectGroupAvatar(SelectGroupAvatarRequest) returns (SelectGroupAvatarResponse);
  // DeleteGroupAvatar - убрать фото; если оно было текущим, текущим становится предыдущее.
  rpc DeleteGroupAvatar(DeleteGroupAvatarRequest) returns (DeleteGroupAvatarResponse);
  // личные настройки чата вызывающего: без звука (duration из proto/mute, без него - звук включён),
  // архив (снимает закреп) и закреп наверху списка (до 5, достаёт из архива)
  rpc SetChatMute(SetChatMuteRequest) returns (SetChatMuteResponse);
  rpc SetChatArchived(SetChatArchivedRequest) returns (SetChatArchivedResponse);
  rpc SetChatPinned(SetChatPinnedRequest) returns (SetChatPinnedResponse);

  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);
  rpc AddMembers(AddMembersRequest) returns (AddMembersResponse);
  rpc SetMemberRole(SetMemberRoleRequest) returns (SetMemberRoleResponse);
  // RemoveMember: kick (admin) или выход (user_id = вызывающий); ban только при kick.
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse);
  rpc ListBans(ListBansRequest) returns (ListBansResponse);
  rpc Unban(UnbanRequest) returns (UnbanResponse);

  rpc GetInviteInfo(GetInviteInfoRequest) returns (GetInviteInfoResponse);
  rpc RegenerateInvite(RegenerateInviteRequest) returns (RegenerateInviteResponse);
  rpc RequestJoin(RequestJoinRequest) returns (RequestJoinResponse);
  rpc ListJoinRequests(ListJoinRequestsRequest) returns (ListJoinRequestsResponse);
  rpc ApproveJoinRequest(ApproveJoinRequestRequest) returns (ApproveJoinRequestResponse);
  rpc RejectJoinRequest(RejectJoinRequestRequest) returns (RejectJoinRequestResponse);

  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  rpc GetMessage(GetMessageRequest) returns (GetMessageResponse);
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse);
  rpc EditMessage(EditMessageRequest) returns (EditMessageResponse);
  rpc DeleteMessage(DeleteMessageRequest) returns (DeleteMessageResponse);
  // DeleteMessages - массовое удаление сообщений одного чата (до 20 за раз)
  rpc DeleteMessages(DeleteMessagesRequest) returns (DeleteMessagesResponse);
  // ForwardMessages - копии сообщений одного чата (до 20) в мои чаты (до 5) и/или в «Избранное»
  rpc ForwardMessages(ForwardMessagesRequest) returns (ForwardMessagesResponse);
  rpc MarkRead(MarkReadRequest) returns (MarkReadResponse);
  rpc ListReaders(ListReadersRequest) returns (ListReadersResponse);

  // закреплённые сообщения: scope "all" - для всех (в группе только админы), "me" - только для себя (личный чат)
  rpc ListPins(ListPinsRequest) returns (ListPinsResponse);
  rpc PinMessage(PinMessageRequest) returns (PinMessageResponse);
  rpc UnpinMessage(UnpinMessageRequest) returns (UnpinMessageResponse);

  // реакции на сообщения: добавить или снять свою реакцию; ответ - актуальные реакции сообщения
  rpc AddReaction(AddReactionRequest) returns (AddReactionResponse);
  rpc RemoveReaction(RemoveReactionRequest) returns (RemoveReactionResponse);
  // непрочитанные упоминания пользователя в чате (в хронологическом порядке)
  rpc ListUnreadMentions(ListUnreadMentionsRequest) returns (ListUnreadMentionsResponse);
}

// Вызовы между сервисами; Gateway их наружу не открывает.
service ConversationInternalService {
  // ListDirectPeers — собеседники пользователя по direct-чатам (presence в Gateway).
  rpc ListDirectPeers(ListDirectPeersRequest) returns (ListDirectPeersResponse);
  // ListMemberIDs - участники чата, если user_id состоит в нём (индикатор набора в Gateway)
  rpc ListMemberIDs(ListMemberIDsRequest) returns (ListMemberIDsResponse);
}

message Conversation {
  string id = 1;
  string conversation_type = 2;
  string visibility = 3;
  optional string name = 4;
  optional string description = 5;
  optional string avatar_url = 6;
  google.protobuf.Timestamp last_message_at = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  // Только у групп; не задан — статуса нет или он истёк.
  status.v1.Status status = 10;
  // только у групп; не задана - фигуры нет
  avatarshape.v1.AvatarShape avatar_shape = 11;
  // код ссылки открытой группы (/chat/<slug>)
  optional string slug = 12;
}

// Message — расшифрованное сообщение; content отсутствует у удалённых.
message Message {
  string id = 1;
  string conversation_id = 2;
  string sender_id = 3;
  optional string content = 4;
  optional string reply_to_message_id = 5;
  bool is_edited = 6;
  bool is_deleted = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  // user или system; у системного (событие состава группы) нет content, есть system_event и target_id
  string kind = 10;
  optional string system_event = 11;
  optional string target_id = 12;
  // пересланная копия; forwarded_from_user_id - первый автор, без него - автор скрыл имя
  bool is_forwarded = 13;
  optional string forwarded_from_user_id = 14;
  // форматирование текста
  repeated MessageEntity entities = 15;
  // отправлено без звука (не показывает уведомление и не воспроизводит звук)
  bool is_silent = 16;
  // агрегированные реакции сообщения
  repeated MessageReaction reactions = 17;
  // превью ссылки (OpenGraph), если есть
  LinkPreview link_preview = 18;
}

message LinkPreview {
  string url = 1;
  optional string title = 2;
  optional string description = 3;
  optional string image_url = 4;
  optional string site_name = 5;
}

message MessageReaction {
  string emoji = 1;
  int32 count = 2;
  bool me = 3;
  repeated string user_ids = 4;
}

// MessageEntity - форматированный фрагмент текста; offset и length в единицах UTF-16 (как индексы строки JS)
message MessageEntity {
  string type = 1;
  int32 offset = 2;
  int32 length = 3;
  // для text_link (http/https URL)
  optional string url = 4;
  // для mention (UUID упомянутого пользователя)
  optional string user_id = 5;
  // для pre (язык блока кода, опционально)
  optional string language = 6;
}

message ConversationSummary {
  Conversation conversation = 1;
  string my_role = 2;
  optional string peer_id = 3;
  Message last_message = 4;
  int32 unread_count = 5;
  // последнее сообщение прочитал кто-то кроме его автора (галочки у своего сообщения)
  bool last_message_read = 6;
  int32 members_count = 7;
  // код ссылки закрытой группы: только админам и только в GetConversation
  optional string invite_code = 8;
  // личные настройки чата вызывающего
  optional google.protobuf.Timestamp muted_until = 9;
  optional google.protobuf.Timestamp archived_at = 10;
  optional google.protobuf.Timestamp pinned_at = 11;
  // «Избранное» - личный чат с самим собой (peer_id нет)
  bool is_saved = 12;
  // число непрочитанных упоминаний вызывающего в этом чате
  int32 unread_mentions_count = 13;
}

message ForwardMessagesRequest {
  repeated string message_ids = 1;
  repeated string conversation_ids = 2;
  // также в «Избранное» (создаётся, если его ещё нет)
  bool to_saved = 3;
  // без указания автора: копия - обычное сообщение пересылающего
  bool hide_author = 4;
}
message ForwardedChat {
  string conversation_id = 1;
  repeated Message messages = 2;
}
message ForwardMessagesResponse {
  repeated ForwardedChat items = 1;
}

message PinnedMessage {
  Message message = 1;
  string scope = 2;
  string pinned_by = 3;
  google.protobuf.Timestamp pinned_at = 4;
}

message ListPinsRequest {
  string conversation_id = 1;
}
message ListPinsResponse {
  repeated PinnedMessage items = 1;
}

message PinMessageRequest {
  string conversation_id = 1;
  string message_id = 2;
  string scope = 3;
}
message PinMessageResponse {
  PinnedMessage pin = 1;
}

message UnpinMessageRequest {
  string conversation_id = 1;
  string message_id = 2;
  string scope = 3;
}
message UnpinMessageResponse {}

// ChatSettings - личные настройки чата участника
message ChatSettings {
  string conversation_id = 1;
  optional google.protobuf.Timestamp muted_until = 2;
  optional google.protobuf.Timestamp archived_at = 3;
  optional google.protobuf.Timestamp pinned_at = 4;
}

message Member {
  string conversation_id = 1;
  string user_id = 2;
  string role = 3;
  optional string last_read_message_id = 4;
  google.protobuf.Timestamp joined_at = 5;
}

message Ban {
  string user_id = 1;
  string banned_by = 2;
  google.protobuf.Timestamp created_at = 3;
}

message JoinRequest {
  string id = 1;
  string conversation_id = 2;
  string user_id = 3;
  string status = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message InviteInfo {
  string conversation_id = 1;
  optional string name = 2;
  optional string description = 3;
  optional string avatar_url = 4;
  int32 members_count = 5;
  bool is_member = 6;
  optional string request_status = 7;
  status.v1.Status status = 8;
  avatarshape.v1.AvatarShape avatar_shape = 9;
  string visibility = 10;
  optional string slug = 11;
}

message PublicGroup {
  string id = 1;
  string name = 2;
  optional string description = 3;
  optional string avatar_url = 4;
  int32 members_count = 5;
  bool is_member = 6;
  status.v1.Status status = 7;
  avatarshape.v1.AvatarShape avatar_shape = 8;
  string slug = 9;
}

message ListConversationsRequest {
  int32 limit = 1;
  int32 offset = 2;
  // true - только архивные чаты, иначе только не архивные
  bool archived = 3;
}
message ListConversationsResponse {
  repeated ConversationSummary items = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message GetConversationRequest {
  string conversation_id = 1;
}
message GetConversationResponse {
  ConversationSummary conversation = 1;
}

message SearchPublicGroupsRequest {
  string query = 1;
  int32 limit = 2;
  int32 offset = 3;
}
message SearchPublicGroupsResponse {
  repeated PublicGroup items = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message CreateGroupRequest {
  string name = 1;
  optional string description = 2;
  optional string avatar_url = 3;
  string visibility = 4;
  repeated string member_ids = 5;
  // код ссылки, обязателен для открытой группы
  optional string slug = 6;
}
message CreateGroupResponse {
  Conversation conversation = 1;
  // invite_token - код ссылки закрытой группы в момент его выпуска
  optional string invite_token = 2;
}

message UpdateGroupRequest {
  string conversation_id = 1;
  optional string name = 2;
  optional string description = 3;
  optional string avatar_url = 4;
  optional string visibility = 5;
  optional string slug = 6;
}
message UpdateGroupResponse {
  Conversation conversation = 1;
  optional string invite_token = 2;
}

message DeleteConversationRequest {
  string conversation_id = 1;
  // только для личного чата: удалить у обоих, иначе - только у себя
  bool for_everyone = 2;
}
message DeleteConversationResponse {}

message ClearHistoryRequest {
  string conversation_id = 1;
}
message ClearHistoryResponse {}

message JoinGroupRequest {
  string conversation_id = 1;
}
message JoinGroupResponse {}

message AvatarPhoto {
  string id = 1;
  string avatar_url = 2;
  google.protobuf.Timestamp created_at = 3;
  bool is_current = 4;
}
message ListGroupAvatarsRequest {
  string conversation_id = 1;
}
message ListGroupAvatarsResponse {
  repeated AvatarPhoto items = 1;
}
message AddGroupAvatarRequest {
  string conversation_id = 1;
  string avatar_url = 2;
}
message AddGroupAvatarResponse {
  repeated string evicted_urls = 1;
}
message SelectGroupAvatarRequest {
  string conversation_id = 1;
  string avatar_id = 2;
}
message SelectGroupAvatarResponse {}
message DeleteGroupAvatarRequest {
  string conversation_id = 1;
  // пусто - текущее фото
  optional string avatar_id = 2;
}
message DeleteGroupAvatarResponse {
  optional string removed_url = 1;
}

message SetChatMuteRequest {
  string conversation_id = 1;
  optional string duration = 2;
}
message SetChatMuteResponse {
  ChatSettings settings = 1;
}

message SetChatArchivedRequest {
  string conversation_id = 1;
  bool archived = 2;
}
message SetChatArchivedResponse {
  ChatSettings settings = 1;
}

message SetChatPinnedRequest {
  string conversation_id = 1;
  bool pinned = 2;
}
message SetChatPinnedResponse {
  ChatSettings settings = 1;
}

message ListMembersRequest {
  string conversation_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}
message ListMembersResponse {
  repeated Member items = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message AddMembersRequest {
  string conversation_id = 1;
  repeated string user_ids = 2;
}
message AddMembersResponse {}

message SetMemberRoleRequest {
  string conversation_id = 1;
  string user_id = 2;
  string role = 3;
}
message SetMemberRoleResponse {}

message RemoveMemberRequest {
  string conversation_id = 1;
  string user_id = 2;
  bool ban = 3;
}
message RemoveMemberResponse {}

message ListBansRequest {
  string conversation_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}
message ListBansResponse {
  repeated Ban items = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message UnbanRequest {
  string conversation_id = 1;
  string user_id = 2;
}
message UnbanResponse {}

message GetInviteInfoRequest {
  string token = 1;
}
message GetInviteInfoResponse {
  InviteInfo info = 1;
}

message RegenerateInviteRequest {
  string conversation_id = 1;
}
message RegenerateInviteResponse {
  string invite_token = 1;
}

message RequestJoinRequest {
  string conversation_id = 1;
  string invite_token = 2;
}
message RequestJoinResponse {
  JoinRequest request = 1;
}

message ListJoinRequestsRequest {
  string conversation_id = 1;
  // pending (по умолчанию), approved или rejected.
  string status = 2;
  int32 limit = 3;
  int32 offset = 4;
}
message ListJoinRequestsResponse {
  repeated JoinRequest items = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ApproveJoinRequestRequest {
  string conversation_id = 1;
  string request_id = 2;
}
message ApproveJoinRequestResponse {}

message RejectJoinRequestRequest {
  string conversation_id = 1;
  string request_id = 2;
}
message RejectJoinRequestResponse {}

// SendMessageRequest: ровно одно из conversation_id / recipient_id.
message SendMessageRequest {
  optional string conversation_id = 1;
  optional string recipient_id = 2;
  string content = 3;
  optional string reply_to_message_id = 4;
  repeated MessageEntity entities = 5;
  bool is_silent = 6;
  LinkPreview link_preview = 7;
}
message SendMessageResponse {
  Message message = 1;
}

message GetMessageRequest {
  string message_id = 1;
}
message GetMessageResponse {
  Message message = 1;
}

message ListMessagesRequest {
  string conversation_id = 1;
  optional string before = 2;
  int32 limit = 3;
  optional string after = 4;
  optional string around = 5;
}
message ListMessagesResponse {
  repeated Message items = 1;
  int32 limit = 2;
  optional string next_before = 3;
  optional string next_after = 4;
  bool has_older = 5;
  bool has_newer = 6;
}

message EditMessageRequest {
  string message_id = 1;
  string content = 2;
  // новая разметка целиком; пусто - без форматирования
  repeated MessageEntity entities = 3;
  LinkPreview link_preview = 4;
}
message EditMessageResponse {
  Message message = 1;
}

message DeleteMessageRequest {
  string message_id = 1;
}
message DeleteMessageResponse {}

message DeleteMessagesRequest {
  repeated string message_ids = 1;
}
message DeleteMessagesResponse {}

message MarkReadRequest {
  string conversation_id = 1;
  string message_id = 2;
}
message MarkReadResponse {}

message ListReadersRequest {
  string conversation_id = 1;
  string message_id = 2;
}
message ListReadersResponse {
  repeated string user_ids = 1;
}

message ListDirectPeersRequest {
  string user_id = 1;
}
message ListDirectPeersResponse {
  repeated string user_ids = 1;
}

message ListMemberIDsRequest {
  string conversation_id = 1;
  string user_id = 2;
}
message ListMemberIDsResponse {
  repeated string user_ids = 1;
}

message AddReactionRequest {
  string message_id = 1;
  string emoji = 2;
}
message AddReactionResponse {
  repeated MessageReaction reactions = 1;
}

message RemoveReactionRequest {
  string message_id = 1;
  string emoji = 2;
}
message RemoveReactionResponse {
  repeated MessageReaction reactions = 1;
}

message ListUnreadMentionsRequest {
  string conversation_id = 1;
  int32 limit = 2;
}
message ListUnreadMentionsResponse {
  repeated string message_ids = 1;
}

// Поля статуса — как в user.v1.SetStatusRequest.
message SetGroupStatusRequest {
  string conversation_id = 1;
  string icon = 2;
  string text = 3;
  string background = 4;
  string foreground = 5;
  string duration = 6;
}
message SetGroupStatusResponse {
  status.v1.Status status = 1;
}
message ClearGroupStatusRequest {
  string conversation_id = 1;
}
message ClearGroupStatusResponse {}

message SetGroupAvatarShapeRequest {
  string conversation_id = 1;
  string shape = 2;
  // #RRGGBB
  string color = 3;
}
message SetGroupAvatarShapeResponse {
  avatarshape.v1.AvatarShape avatar_shape = 1;
}
message ClearGroupAvatarShapeRequest {
  string conversation_id = 1;
}
message ClearGroupAvatarShapeResponse {}
