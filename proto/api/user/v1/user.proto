syntax = "proto3";

package user.v1;

import "google/protobuf/timestamp.proto";
import "avatarshape/v1/avatarshape.proto";
import "status/v1/status.proto";

option go_package = "github.com/maltira/chavo-project-backend/proto/gen/go/user/v1;userv1";

// Методы работают от имени пользователя из metadata x-user-id (ставит Gateway).
service UserService {
  rpc CreateProfile(CreateProfileRequest) returns (CreateProfileResponse);
  rpc GetMe(GetMeRequest) returns (GetMeResponse);
  rpc UpdateMe(UpdateMeRequest) returns (UpdateMeResponse);
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  rpc SearchProfiles(SearchProfilesRequest) returns (SearchProfilesResponse);

  // История аватарок: до 5 последних фото, первое (самое новое) - текущее. Список другого пользователя
  // пуст, если он заблокировал вызывающего.
  rpc ListAvatars(ListAvatarsRequest) returns (ListAvatarsResponse);
  // AddAvatar - новое фото становится текущим; evicted_urls - выпавшие из истории (файлы удаляет Gateway).
  rpc AddAvatar(AddAvatarRequest) returns (AddAvatarResponse);
  // SelectAvatar - сделать фото из истории текущим.
  rpc SelectAvatar(SelectAvatarRequest) returns (SelectAvatarResponse);
  // DeleteAvatar - убрать фото из истории; если оно было текущим, текущим становится предыдущее.
  rpc DeleteAvatar(DeleteAvatarRequest) returns (DeleteAvatarResponse);

  rpc ListBlocked(ListBlockedRequest) returns (ListBlockedResponse);
  rpc GetBlockStatus(GetBlockStatusRequest) returns (GetBlockStatusResponse);
  rpc BlockUser(BlockUserRequest) returns (BlockUserResponse);
  rpc UnblockUser(UnblockUserRequest) returns (UnblockUserResponse);

  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse);
  rpc UpdateSettings(UpdateSettingsRequest) returns (UpdateSettingsResponse);

  // SetStatus ставит новый статус целиком (прежний заменяется); редактировать установленный нельзя.
  rpc SetStatus(SetStatusRequest) returns (SetStatusResponse);
  rpc ClearStatus(ClearStatusRequest) returns (ClearStatusResponse);

  // SetAvatarShape ставит фигуру позади аватара целиком (прежняя заменяется); редактировать нельзя
  rpc SetAvatarShape(SetAvatarShapeRequest) returns (SetAvatarShapeResponse);
  rpc ClearAvatarShape(ClearAvatarShapeRequest) returns (ClearAvatarShapeResponse);
}

// Вызовы между сервисами; Gateway их наружу не открывает.
service UserInternalService {
  rpc MessagingAllowed(MessagingAllowedRequest) returns (MessagingAllowedResponse);
  rpc UserExists(UserExistsRequest) returns (UserExistsResponse);
  rpc GroupInviteAllowed(GroupInviteAllowedRequest) returns (GroupInviteAllowedResponse);
  // PresenceVisible: можно ли показывать онлайн пользователя другим (show_online_status).
  rpc PresenceVisible(PresenceVisibleRequest) returns (PresenceVisibleResponse);
  // BlockedIDs — кого заблокировал пользователь: им не доставляются его онлайн и статус.
  rpc BlockedIDs(BlockedIDsRequest) returns (BlockedIDsResponse);
  // ForwardAuthorsHidden - кто из пользователей скрывает имя в пересланных сообщениях (hide_forward_author).
  rpc ForwardAuthorsHidden(ForwardAuthorsHiddenRequest) returns (ForwardAuthorsHiddenResponse);
  // SearchProfilesByIDs - поиск профилей среди заданного набора пользователей (упоминания в больших группах).
  rpc SearchProfilesByIDs(SearchProfilesByIDsRequest) returns (SearchProfilesByIDsResponse);
}

message Profile {
  string user_id = 1;
  string username = 2;
  string display_name = 3;
  optional string bio = 4;
  optional string avatar_url = 5;
  // Не заполнено, если пользователь скрыл онлайн-статус (кроме собственного профиля).
  google.protobuf.Timestamp last_seen_at = 6;
  bool online = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  // Не задан — статуса нет, он истёк или скрыт от заблокированного.
  status.v1.Status status = 10;
  // не задана - фигуры нет или она скрыта от заблокированного
  avatarshape.v1.AvatarShape avatar_shape = 11;
  // аккаунт удалён: показывается как «Удалённый аккаунт» без username и фото
  bool is_deleted = 12;
}

message AvatarPhoto {
  string id = 1;
  string avatar_url = 2;
  google.protobuf.Timestamp created_at = 3;
  bool is_current = 4;
}
message ListAvatarsRequest {
  string user_id = 1;
}
message ListAvatarsResponse {
  repeated AvatarPhoto items = 1;
}
message AddAvatarRequest {
  string avatar_url = 1;
}
message AddAvatarResponse {
  repeated string evicted_urls = 1;
}
message SelectAvatarRequest {
  string avatar_id = 1;
}
message SelectAvatarResponse {}
message DeleteAvatarRequest {
  // пусто - текущее фото
  optional string avatar_id = 1;
}
message DeleteAvatarResponse {
  // адрес удалённого фото: его файлы удаляет Gateway; пусто, если удалять было нечего
  optional string removed_url = 1;
}

message Settings {
  string user_id = 1;
  bool allow_group_invites = 2;
  bool show_online_status = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  // при пересылке моих сообщений вместо имени - «скрытый автор»
  bool hide_forward_author = 6;
  // избранные эмодзи панели в поле ввода: до 30, в порядке добавления
  repeated string favorite_emojis = 7;
}

message BlockedEntry {
  string blocked_user_id = 1;
  string username = 2;
  string display_name = 3;
  optional string avatar_url = 4;
  google.protobuf.Timestamp blocked_at = 5;
}

message CreateProfileRequest {
  string username = 1;
  string display_name = 2;
  optional string bio = 3;
  optional string avatar_url = 4;
}
message CreateProfileResponse {}

message GetMeRequest {}
message GetMeResponse {
  Profile profile = 1;
}

message UpdateMeRequest {
  optional string username = 1;
  optional string display_name = 2;
  optional string bio = 3;
  optional string avatar_url = 4;
}
message UpdateMeResponse {}

message GetProfileRequest {
  string user_id = 1;
}
message GetProfileResponse {
  Profile profile = 1;
}

message SearchProfilesRequest {
  string query = 1;
  int32 limit = 2;
  int32 offset = 3;
}
message SearchProfilesResponse {
  repeated Profile profiles = 1;
}

message ListBlockedRequest {
  int32 limit = 1;
  int32 offset = 2;
}
message ListBlockedResponse {
  repeated BlockedEntry items = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message GetBlockStatusRequest {
  string user_id = 1;
}
message GetBlockStatusResponse {
  bool blocked_by_me = 1;
  bool blocked_by_them = 2;
}

message BlockUserRequest {
  string user_id = 1;
}
message BlockUserResponse {}

message UnblockUserRequest {
  string user_id = 1;
}
message UnblockUserResponse {}

message GetSettingsRequest {}
message GetSettingsResponse {
  Settings settings = 1;
}

message UpdateSettingsRequest {
  optional bool allow_group_invites = 1;
  optional bool show_online_status = 2;
  optional bool hide_forward_author = 3;
  // весь список целиком (пустой очищает); не задан - не меняется
  optional EmojiList favorite_emojis = 4;
}
message EmojiList {
  repeated string items = 1;
}
message UpdateSettingsResponse {}

message ForwardAuthorsHiddenRequest {
  repeated string user_ids = 1;
}
message ForwardAuthorsHiddenResponse {
  repeated string hidden_user_ids = 1;
}

message SearchProfilesByIDsRequest {
  repeated string user_ids = 1;
  string query = 2;
  int32 limit = 3;
  optional string viewer_id = 4;
}
message SearchProfilesByIDsResponse {
  repeated Profile profiles = 1;
}

message MessagingAllowedRequest {
  string sender_id = 1;
  string recipient_id = 2;
}
message MessagingAllowedResponse {
  bool allowed = 1;
  bool blocked_by_sender = 2;
  bool blocked_by_recipient = 3;
}

message UserExistsRequest {
  string user_id = 1;
}
message UserExistsResponse {
  bool exists = 1;
}

message GroupInviteAllowedRequest {
  string user_id = 1;
  string inviter_id = 2;
}
message GroupInviteAllowedResponse {
  bool allowed = 1;
}

message PresenceVisibleRequest {
  repeated string user_ids = 1;
  // with_last_seen — вернуть и last_seen_at (снимок presence для клиента).
  bool with_last_seen = 2;
  // viewer_id — для кого снимок: владельцы, заблокировавшие viewer, для него не видны.
  optional string viewer_id = 3;
}
message PresenceVisibleResponse {
  // user_id → виден ли онлайн другим; отсутствующие пользователи не попадают в ответ.
  map<string, bool> visible = 1;
  // Только при with_last_seen и только для видимых пользователей.
  map<string, google.protobuf.Timestamp> last_seen_at = 2;
}

message BlockedIDsRequest {
  string user_id = 1;
}
message BlockedIDsResponse {
  repeated string user_ids = 1;
}

// icon — ключ иконки из каталога; background и foreground — #RRGGBB (обязательны);
// duration — ключ срока: 1h, 4h, 24h, 7d, never.
message SetStatusRequest {
  string icon = 1;
  string text = 2;
  string background = 3;
  string foreground = 4;
  string duration = 5;
}
message SetStatusResponse {
  status.v1.Status status = 1;
}
message ClearStatusRequest {}
message ClearStatusResponse {}

// shape - ключ фигуры из каталога; color - #RRGGBB (обязателен)
message SetAvatarShapeRequest {
  string shape = 1;
  string color = 2;
}
message SetAvatarShapeResponse {
  avatarshape.v1.AvatarShape avatar_shape = 1;
}
message ClearAvatarShapeRequest {}
message ClearAvatarShapeResponse {}
