# Общие заголовки прокси в Gateway. Подключается в каждом location: proxy_set_header внутри location
# отменяет наследование заголовков с уровня server.
proxy_http_version 1.1;
proxy_set_header Host              $host;
# Заменяет, а не дополняет: цепочку X-Forwarded-For от клиента подделать нельзя.
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-ID      $chavo_request_id;
# Личность пользователя Gateway берёт только из токена; заголовок клиента вырезается.
proxy_set_header X-User-ID         "";
# WebSocket: Upgrade клиента пробрасывается; без него Connection пустой — работает keepalive к upstream.
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;
