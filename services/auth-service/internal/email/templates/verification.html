<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Подтверждение email</title>
</head>

<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px;">
    <div style="max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px;">
        <h2>Добро пожаловать в Chavo</h2>
        <p>Спасибо за регистрацию. Чтобы завершить создание аккаунта, подтвердите свой email по ссылке ниже:</p>

        <a href="{{.VerifyURL}}" style="display: inline-block; background-color: #0078D4; color: white; padding: 14px 28px; 
                  text-decoration: none; border-radius: 6px; font-weight: bold; margin: 20px 0;">
            Подтвердить email
        </a>

        <p>Ссылка действительна в течение {{.ExpiresIn}}.</p>
        <p>Если вы не регистрировались — просто проигнорируйте это письмо.</p>

        <hr style="margin: 30px 0;">
        <p style="color: #666; font-size: 14px;">
            С уважением,<br>
            Команда Chavo
        </p>
    </div>
</body>

</html>
