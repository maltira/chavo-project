syntax = "proto3";

package status.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/maltira/chavo-project-backend/proto/gen/go/status/v1;statusv1";

// Status — статус пользователя или группы. icon — ключ из фиксированного набора (каталог proto/status);
// background и foreground (общий цвет текста и иконки) выбирает пользователь, формат #RRGGBB.
message Status {
  string icon = 1;
  string text = 2;
  google.protobuf.Timestamp expires_at = 3;
  string background = 4;
  string foreground = 5;
}
