services:
  # ==============================================
  # INFRASTRUCTURE SERVICES
  # ==============================================

  postgres:
    image: postgres:16-alpine
    container_name: chavo-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - AUTH_DB_NAME=${AUTH_DB_NAME}
      - USER_DB_NAME=${USER_DB_NAME}
      - CONVERSATION_DB_NAME=${CONVERSATION_DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh:ro
    ports:
      - 5432:5432
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - chavo-network

  migrate:
    image: migrate/migrate:v4.19.1
    container_name: chavo-migrate
    volumes:
      - ./migrations:/migrations
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        echo "Running migrations for auth-service..."
        migrate -path=/migrations/auth -database="postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AUTH_DB_NAME}?sslmode=disable" up
        echo "Running migrations for user-service..."
        migrate -path=/migrations/user -database="postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${USER_DB_NAME}?sslmode=disable" up
        echo "Running migrations for conversation-service..."
        migrate -path=/migrations/conversation -database="postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${CONVERSATION_DB_NAME}?sslmode=disable" up
        echo "All migrations applied successfully."
    networks:
      - chavo-network

  kafka:
    image: confluentinc/cp-kafka:8.3.1
    container_name: chavo-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_LOG_DIRS: /var/lib/kafka/data

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 24

      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "/usr/bin/kafka-broker-api-versions --bootstrap-server localhost:9092" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - chavo-network

  kafka-init:
    image: confluentinc/cp-kafka:8.3.1
    container_name: chavo-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        echo "Creating Kafka topics..."

        kafka-topics \
          --bootstrap-server kafka:29092 \
          --create \
          --if-not-exists \
          --topic auth-events \
          --partitions 3 \
          --replication-factor 1

        kafka-topics \
          --bootstrap-server kafka:29092 \
          --create \
          --if-not-exists \
          --topic user-events \
          --partitions 3 \
          --replication-factor 1

        kafka-topics \
          --bootstrap-server kafka:29092 \
          --create \
          --if-not-exists \
          --topic conversation-events \
          --partitions 3 \
          --replication-factor 1

        kafka-topics \
          --bootstrap-server kafka:29092 \
          --create \
          --if-not-exists \
          --topic message-events \
          --partitions 3 \
          --replication-factor 1 \
          --config retention.ms=86400000

        kafka-topics \
          --bootstrap-server kafka:29092 \
          --create \
          --if-not-exists \
          --topic presence-events \
          --partitions 3 \
          --replication-factor 1

        echo "Kafka topics created successfully."

        kafka-topics \
          --bootstrap-server kafka:29092 \
          --list

    networks:
      - chavo-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: chavo-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${KAFKA_UI_PORT}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: chavo-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_METRICS_TYPE: KRAFT
      DYNAMIC_CONFIG_ENABLED: true
    networks:
      - chavo-network

  redis:
    image: redis:7.2-alpine
    container_name: chavo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - chavo-network

  # ==============================================
  # BACKEND SERVICES
  # ==============================================

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: chavo-auth
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AUTH_DB_NAME}?sslmode=disable
      - REDIS_URL=${REDIS_URL}
      - KAFKA_BROKERS=kafka:29092
      - JWT_SECRET=${JWT_SECRET}
      - ACCESS_TOKEN_DURATION=${ACCESS_TOKEN_DURATION}
      - REFRESH_TOKEN_DURATION=${REFRESH_TOKEN_DURATION}
      - VERIFICATION_TTL=${VERIFICATION_TTL}
      - FRONTEND_URL=${FRONTEND_URL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - ENV=${ENV}
      - PORT=${AUTH_PORT}
    healthcheck:
      test: [ "CMD", "./auth", "healthcheck" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - chavo-network

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: chavo-user
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${USER_DB_NAME}?sslmode=disable
      - REDIS_URL=${REDIS_URL}
      - KAFKA_BROKERS=kafka:29092
      - ENV=${ENV}
      - PORT=${USER_PORT}
    healthcheck:
      test: [ "CMD", "./user", "healthcheck" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - chavo-network

  conversation-service:
    build:
      context: .
      dockerfile: services/conversation-service/Dockerfile
    container_name: chavo-conversation
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${CONVERSATION_DB_NAME}?sslmode=disable
      - KAFKA_BROKERS=kafka:29092
      - MESSAGE_ENCRYPTION_KEY=${MESSAGE_ENCRYPTION_KEY}
      - USER_SERVICE_ADDR=user-service:${USER_PORT}
      - ENV=${ENV}
      - PORT=${CONVERSATION_PORT}
    healthcheck:
      test: [ "CMD", "./conversation", "healthcheck" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - chavo-network

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: chavo-gateway
    restart: unless-stopped
    # Порт опубликован, пока перед Gateway нет nginx.
    ports:
      - "${GATEWAY_PORT:-8000}:${GATEWAY_PORT:-8000}"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_URL=${REDIS_URL}
      - AUTH_SERVICE_ADDR=auth-service:${AUTH_PORT}
      - USER_SERVICE_ADDR=user-service:${USER_PORT}
      - CONVERSATION_SERVICE_ADDR=conversation-service:${CONVERSATION_PORT}
      - GRPC_TIMEOUT=${GRPC_TIMEOUT}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES}
      - FRONTEND_ORIGIN=${FRONTEND_URL}
      - ENV=${ENV}
      - PORT=${GATEWAY_PORT:-8000}
    healthcheck:
      test: [ "CMD", "./gateway", "healthcheck" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      conversation-service:
        condition: service_healthy
    networks:
      - chavo-network

networks:
  chavo-network:
    name: chavo-network
    driver: bridge

volumes:
  postgres_data:
  kafka_data:
  redis_data:
