syntax = "proto3";

package user.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/maltira/chavo-project-backend/proto/gen/go/user/v1;userv1";

// Методы работают от имени пользователя из metadata x-user-id (ставит Gateway).
service UserService {
  rpc CreateProfile(CreateProfileRequest) returns (CreateProfileResponse);
  rpc GetMe(GetMeRequest) returns (GetMeResponse);
  rpc UpdateMe(UpdateMeRequest) returns (UpdateMeResponse);
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  rpc SearchProfiles(SearchProfilesRequest) returns (SearchProfilesResponse);

  rpc ListBlocked(ListBlockedRequest) returns (ListBlockedResponse);
  rpc GetBlockStatus(GetBlockStatusRequest) returns (GetBlockStatusResponse);
  rpc BlockUser(BlockUserRequest) returns (BlockUserResponse);
  rpc UnblockUser(UnblockUserRequest) returns (UnblockUserResponse);

  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse);
  rpc UpdateSettings(UpdateSettingsRequest) returns (UpdateSettingsResponse);
}

// Вызовы между сервисами; Gateway их наружу не открывает.
service UserInternalService {
  rpc MessagingAllowed(MessagingAllowedRequest) returns (MessagingAllowedResponse);
  rpc UserExists(UserExistsRequest) returns (UserExistsResponse);
  rpc GroupInviteAllowed(GroupInviteAllowedRequest) returns (GroupInviteAllowedResponse);
  // PresenceVisible: можно ли показывать онлайн пользователя другим (show_online_status).
  rpc PresenceVisible(PresenceVisibleRequest) returns (PresenceVisibleResponse);
}

message Profile {
  string user_id = 1;
  string username = 2;
  string display_name = 3;
  optional string bio = 4;
  optional string avatar_url = 5;
  // Не заполнено, если пользователь скрыл онлайн-статус (кроме собственного профиля).
  google.protobuf.Timestamp last_seen_at = 6;
  bool online = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message Settings {
  string user_id = 1;
  bool allow_group_invites = 2;
  bool show_online_status = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message BlockedEntry {
  string blocked_user_id = 1;
  string username = 2;
  string display_name = 3;
  optional string avatar_url = 4;
  google.protobuf.Timestamp blocked_at = 5;
}

message CreateProfileRequest {
  string username = 1;
  string display_name = 2;
  optional string bio = 3;
  optional string avatar_url = 4;
}
message CreateProfileResponse {}

message GetMeRequest {}
message GetMeResponse {
  Profile profile = 1;
}

message UpdateMeRequest {
  optional string username = 1;
  optional string display_name = 2;
  optional string bio = 3;
  optional string avatar_url = 4;
}
message UpdateMeResponse {}

message GetProfileRequest {
  string user_id = 1;
}
message GetProfileResponse {
  Profile profile = 1;
}

message SearchProfilesRequest {
  string query = 1;
  int32 limit = 2;
  int32 offset = 3;
}
message SearchProfilesResponse {
  repeated Profile profiles = 1;
}

message ListBlockedRequest {
  int32 limit = 1;
  int32 offset = 2;
}
message ListBlockedResponse {
  repeated BlockedEntry items = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message GetBlockStatusRequest {
  string user_id = 1;
}
message GetBlockStatusResponse {
  bool blocked_by_me = 1;
  bool blocked_by_them = 2;
}

message BlockUserRequest {
  string user_id = 1;
}
message BlockUserResponse {}

message UnblockUserRequest {
  string user_id = 1;
}
message UnblockUserResponse {}

message GetSettingsRequest {}
message GetSettingsResponse {
  Settings settings = 1;
}

message UpdateSettingsRequest {
  optional bool allow_group_invites = 1;
  optional bool show_online_status = 2;
}
message UpdateSettingsResponse {}

message MessagingAllowedRequest {
  string sender_id = 1;
  string recipient_id = 2;
}
message MessagingAllowedResponse {
  bool allowed = 1;
  bool blocked_by_sender = 2;
  bool blocked_by_recipient = 3;
}

message UserExistsRequest {
  string user_id = 1;
}
message UserExistsResponse {
  bool exists = 1;
}

message GroupInviteAllowedRequest {
  string user_id = 1;
  string inviter_id = 2;
}
message GroupInviteAllowedResponse {
  bool allowed = 1;
}

message PresenceVisibleRequest {
  repeated string user_ids = 1;
}
message PresenceVisibleResponse {
  // user_id → виден ли онлайн другим; отсутствующие пользователи не попадают в ответ.
  map<string, bool> visible = 1;
}
